[workspace]
resolver = "2"
members = ["crates/core", "crates/providers", "crates/workspaces", "crates/config", "apps/daemon", "apps/cli"]
exclude = ["tools/environment-smoke", "apps/desktop/src-tauri"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Keep complete executable/input integrity verification practical in dev/tests.
# Test inherits dev; release already optimizes this unchanged SHA-256 library.
[profile.dev.package.sha2]
opt-level = 3

# Keep the bundled SQLite engine's query work within the same IPC deadlines in
# development and test builds. No change to durability, SQL or release flags.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Keep the same debug assertions, tests, and production behavior while reducing
# time spent checking integration proofs and repository observations in debug.
# Line-level symbols keep the development companion inside its existing size cap.
[profile.dev.package.agentbaton-core]
opt-level = 2
debug = 1

[profile.dev.package.agentbaton-workspaces]
opt-level = 2
debug = 1

# The debug daemon runs the same bounded IPC stage with repeated JSON proof
# serialization and SQLite query binding. Optimize dependency helpers while
# retaining the same debug assertions, budgets, and release profile.
[profile.dev.package.serde_json]
opt-level = 3
debug = 1

[profile.dev.package.serde_core]
opt-level = 3
debug = 1

[profile.dev.package.rusqlite]
opt-level = 2
debug = 1
