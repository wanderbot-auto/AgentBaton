[package]
name = "agentbaton-remote-host"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.38.0", features = ["bundled"] }
sha2 = "=0.10.9"
libc = "=0.2.191"

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "baton-host-companion"
path = "src/main.rs"
