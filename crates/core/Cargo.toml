[package]
name = "agentbaton-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
agentbaton-providers = { path = "../providers" }
sha2 = "0.10"
agentbaton-workspaces = { path = "../workspaces" }
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
rustix = { version = "1", features = ["process", "fs"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
libc = "0.2"
