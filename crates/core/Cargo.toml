[package]
name = "agentbaton-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
agentbaton-config = { path = "../config" }
agentbaton-providers = { path = "../providers" }
sha2 = "0.10"
agentbaton-workspaces = { path = "../workspaces" }
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
rustix = { version = "1", features = ["process", "fs"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
libc = "0.2"

[features]
# Explicit genuine schema15 input gate; missing input is a hard test failure.
actual-schema15-migration-tests = []
# Explicit genuine schema16 input gate; missing input is a hard test failure.
actual-schema16-migration-tests = []
actual-legacy-migration-tests = []
# Non-default, debug-only deterministic evidence seam. Never product authority.
preview-evidence = []

[[test]]
name = "factory_child_goal_legacy_migration"
path = "tests/factory_child_goal_legacy_migration.rs"
required-features = ["actual-legacy-migration-tests"]

[[test]]
name = "task_workspace_actual15_migration"
path = "tests/task_workspace_actual15_migration.rs"
required-features = ["actual-schema15-migration-tests"]

[[test]]
name = "integration_actual16_migration"
path = "tests/integration_actual16_migration.rs"
required-features = ["actual-schema16-migration-tests"]
