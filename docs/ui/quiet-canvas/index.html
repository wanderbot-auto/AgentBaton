<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentBaton · Quiet Canvas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6M8 12h12"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
<symbol id="i-task" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 10 5-10 5L2 8l10-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
<symbol id="i-history" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6m3-4v6l4 2"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l3 4h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11a8 8 0 0 1-8 8H8l-5 3V9a7 7 0 0 1 7-7h3a8 8 0 0 1 8 9Z"/><path d="M8 8h8M8 12h5"/></symbol>
<symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M13 3H5v18h14V9l-6-6Zm0 0v6h6M8 13h8M8 17h5"/></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5M14 4l-4 16"/></symbol>
<symbol id="i-plug" viewBox="0 0 24 24"><path d="M8 3v5m8-5v5M5 8h14M7 8v5a5 5 0 0 0 10 0V8m-5 10v3"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M6 7v10m12-10c0 8-12 3-12 10"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8V4Z"/></symbol>
<symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M12 16v5m-5 0h10"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/></symbol>
</defs></svg>
<header class="appbar">
 <div class="brand"><svg class="brandmark" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18 12 4h5L10 18Zm8 2 6-12h4l-6 12Z"/></svg><span>AgentBaton</span></div>
 <button class="icon-button sidebar-toggle" aria-label="收起导航" data-action="collapse"><svg class="icon"><use href="#i-panel"/></svg></button>
 <div class="top-location"><span data-i18n="personal">个人空间</span><span class="slash">/</span><button class="text-button" data-action="project"><span id="topProject">全部项目</span><svg class="icon small"><use href="#i-chevron"/></svg></button></div>
 <button class="prototype" data-action="about"><span class="outline-dot"></span><span data-i18n="prototype">交互原型 · 示例数据</span></button>
</header>
<aside class="sidebar" aria-label="主导航">
 <div class="side-top"><button class="new-button" data-action="new"><svg class="icon"><use href="#i-plus"/></svg><span data-i18n="new">新任务</span><kbd>⌘ N</kbd></button>
 <button class="nav-item" data-action="search"><svg class="icon"><use href="#i-search"/></svg><span data-i18n="search">搜索</span><kbd>⌘ K</kbd></button></div>
 <nav id="navigation"></nav>
 <div class="side-projects"><div class="section-label" data-i18n="projects">项目</div><div id="projects"></div></div>
 <div class="side-bottom"><button class="nav-item" data-action="quick"><svg class="icon"><use href="#i-chat"/></svg><span data-i18n="quick">快捷对话</span><svg class="icon small trailing"><use href="#i-plus"/></svg></button>
 <div class="account-row"><span class="avatar">O</span><div class="account-text">Personal<span><span class="tiny-dot"></span><span data-i18n="local">本地优先</span></span></div><button class="icon-button" data-action="settings" aria-label="设置"><svg class="icon"><use href="#i-settings"/></svg></button></div></div>
</aside>
<main class="main"><div class="scroll-area" id="scrollArea"><div class="canvas" id="canvas"></div></div>
 <div class="composer-wrap" id="composerWrap"><form class="composer" id="composer">
 <label class="sr-only" for="prompt">任务目标或消息</label><textarea id="prompt" rows="1" placeholder="交给 Agent 一个目标…" maxlength="2000"></textarea>
 <div class="composer-controls"><div class="composer-left"><button type="button" class="icon-button" data-action="attach" aria-label="添加文件"><svg class="icon"><use href="#i-plus"/></svg></button><button type="button" class="text-button" data-action="project"><svg class="icon"><use href="#i-folder"/></svg><span id="composerProject">AgentBaton</span><svg class="icon small"><use href="#i-chevron"/></svg></button><span class="control-separator"></span><button type="button" class="text-button" data-action="agent"><svg class="icon"><use href="#i-spark"/></svg><span id="agentLabel">自动分配</span><svg class="icon small"><use href="#i-chevron"/></svg></button></div><button type="submit" class="send-button" aria-label="发送目标" disabled><svg class="icon"><use href="#i-arrow"/></svg></button></div>
 </form><div class="composer-foot"><span id="composerHint">先说目标，细节交给 Agent。</span><span data-i18n="shortcut">Enter 发送 · Shift Enter 换行</span></div></div>
</main>
<dialog id="modal" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-button" data-action="close" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="modalBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body></html>
