name: Product validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Product / Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo build --locked --bin batond --bin baton && python3 scripts/smoke-local-product.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  frontend:
    name: Product / UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/desktop
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/desktop
  desktop:
    name: Product / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Frontend dependencies and validation
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Core and native host tests
        run: |
          set -euo pipefail
          cargo test --workspace --locked
          cargo build --locked --bin batond --bin baton
          python3 scripts/smoke-local-product.py
          cargo build --release --locked --bin batond --bin baton
          bash scripts/prepare-desktop-sidecars.sh
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build desktop UI and application
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles app
      - name: Package development application and evidence
        run: bash scripts/package-development-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/development/
          if-no-files-found: error
          retention-days: 14
